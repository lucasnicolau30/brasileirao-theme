# Roda os testes a cada push e pull request.
# Os escudos dos clubes (marca registrada) não vão para o Git, então o CI pula os testes que dependem deles
# (escudos, build e pacote); esses rodam no computador de quem gera o .vsix (npm test).
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:ci
